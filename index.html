<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Soutien scolaire — Accueil</title>
<style>
  :root {
    --indigo: #312E81;
    --bleu: #0369A1;
    --vert: #166534;
    --orange: #B45309;
    --texte: #1E293B;
    --texte-secondaire: #64748B;
    --fond: #F8FAFC;
  }
  body {
    font-family: Arial, sans-serif;
    background: var(--fond);
    color: var(--texte);
    margin: 0;
  }
  header {
    background: linear-gradient(135deg, var(--indigo), var(--bleu));
    color: white;
    padding: 70px 30px 50px;
    text-align: center;
  }
  header .kicker {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
    opacity: 0.85;
  }
  header h1 { font-size: 40px; margin: 12px 0 8px; }
  header p { font-size: 17px; opacity: 0.9; }

  main {
    max-width: 900px;
    margin: -30px auto 0;
    padding: 0 20px 70px;
  }

  .grille {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }

  .carte-niveau {
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(15,23,42,0.12);
    padding: 30px 26px;
    text-decoration: none;
    color: var(--texte);
    text-align: center;
    border-top: 6px solid var(--bleu);
    transition: transform 0.15s ease;
  }
  .carte-niveau:hover { transform: translateY(-4px); }
  .carte-niveau.indisponible {
    opacity: 0.5;
    pointer-events: none;
    border-top-color: #CBD5E1;
  }

  .emoji { font-size: 40px; margin-bottom: 10px; }
  .titre-niveau {
    font-size: 22px;
    font-weight: 800;
    color: var(--indigo);
    margin-bottom: 6px;
  }
  .statut {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
  }
  .statut.dispo { background: #F0FDF4; color: var(--vert); }
  .statut.venir { background: #F1F5F9; color: var(--texte-secondaire); }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 13px;
    color: var(--texte-secondaire);
  }
</style>
</head>
<body>

<header>
  <div class="kicker">Soutien scolaire</div>
  <h1>Choisis ton niveau</h1>
  <p>Cours, exercices interactifs et cartes mentales, toutes matières.</p>
</header>

<main>
  <div class="grille">
    <a class="carte-niveau" href="seconde/index.html">
      <div class="emoji">📗</div>
      <div class="titre-niveau">Seconde</div>
      <span class="statut dispo">Disponible</span>
    </a>
    <div class="carte-niveau indisponible">
      <div class="emoji">📘</div>
      <div class="titre-niveau">Première</div>
      <span class="statut venir">À venir</span>
    </div>
    <div class="carte-niveau indisponible">
      <div class="emoji">📙</div>
      <div class="titre-niveau">Terminale</div>
      <span class="statut venir">À venir</span>
    </div>
  </div>
</main>

<footer>
  Soutien scolaire · Tous niveaux, toutes matières
</footer>

</body>
</html>
